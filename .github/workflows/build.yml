name: Build Android

# Đẩy code: chỉ build APK để cài thử.
# Khi đã ổn: Actions -> Build Android -> Run workflow -> tích "aab" để build thêm AAB lên Play.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      aab:
        description: 'Build thêm AAB để lên Google Play'
        type: boolean
        default: true

env:
  GODOT_VERSION: 4.7.2
  GODOT_TAG: 4.7.2-stable
  GODOT_TEMPLATE_DIR: 4.7.2.stable

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Cache Godot
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: |
            ~/godot
            ~/.local/share/godot/export_templates
          key: godot-${{ env.GODOT_TAG }}-v1

      - name: Download Godot + export templates
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/godot ~/.local/share/godot/export_templates/${GODOT_TEMPLATE_DIR}
          cd ~/godot
          wget -q https://github.com/godotengine/godot/releases/download/${GODOT_TAG}/Godot_v${GODOT_TAG}_linux.x86_64.zip
          unzip -q Godot_v${GODOT_TAG}_linux.x86_64.zip
          mv Godot_v${GODOT_TAG}_linux.x86_64 godot
          rm Godot_v${GODOT_TAG}_linux.x86_64.zip
          wget -q https://github.com/godotengine/godot/releases/download/${GODOT_TAG}/Godot_v${GODOT_TAG}_export_templates.tpz
          unzip -q -j Godot_v${GODOT_TAG}_export_templates.tpz 'templates/android_*' 'templates/version.txt' -d ~/.local/share/godot/export_templates/${GODOT_TEMPLATE_DIR}/
          rm Godot_v${GODOT_TAG}_export_templates.tpz
          ls -la ~/.local/share/godot/export_templates/${GODOT_TEMPLATE_DIR}/

      - name: Keystores
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          mkdir -p ~/keys
          keytool -genkeypair -v -keystore ~/keys/debug.keystore -storepass android -alias androiddebugkey \
            -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US" >/dev/null 2>&1
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > ~/keys/release.keystore
            echo "GODOT_ANDROID_KEYSTORE_RELEASE_USER=$KEY_ALIAS" >> $GITHUB_ENV
            echo "GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD=$KEYSTORE_PASSWORD" >> $GITHUB_ENV
            echo "Dùng khóa ký từ Secrets."
          else
            echo "::warning::Chưa có Secrets KEYSTORE_BASE64 / KEYSTORE_PASSWORD / KEY_ALIAS - dùng khóa tạm (chỉ để cài thử APK, không dùng AAB này lên Play)."
            keytool -genkeypair -v -keystore ~/keys/release.keystore -storepass temp123456 -alias laixe3d \
              -keypass temp123456 -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=LaiXe3D" >/dev/null 2>&1
            echo "GODOT_ANDROID_KEYSTORE_RELEASE_USER=laixe3d" >> $GITHUB_ENV
            echo "GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD=temp123456" >> $GITHUB_ENV
          fi
          echo "GODOT_ANDROID_KEYSTORE_RELEASE_PATH=$HOME/keys/release.keystore" >> $GITHUB_ENV
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PATH=$HOME/keys/debug.keystore" >> $GITHUB_ENV
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_USER=androiddebugkey" >> $GITHUB_ENV
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD=android" >> $GITHUB_ENV

      - name: Editor settings (Android SDK, Java)
        run: |
          mkdir -p ~/.config/godot
          for f in editor_settings-4.tres editor_settings-4.7.tres; do
            cat > ~/.config/godot/$f <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/debug_keystore = "$HOME/keys/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF
          done
          cat ~/.config/godot/editor_settings-4.7.tres

      - name: Version code
        run: |
          sed -i "s/^version\/code=.*/version\/code=${{ github.run_number }}/" export_presets.cfg
          sed -i "s/^version\/name=.*/version\/name=\"1.0.${{ github.run_number }}\"/" export_presets.cfg
          grep "version/" export_presets.cfg

      - name: Import project
        run: ~/godot/godot --headless --path . --import || true

      - name: Install Android build template (target/compile SDK 36)
        run: |
          mkdir -p android/build
          echo "${GODOT_TEMPLATE_DIR}" > android/.build_version
          touch android/build/.gdignore
          unzip -q -o ~/.local/share/godot/export_templates/${GODOT_TEMPLATE_DIR}/android_source.zip -d android/build
          CFG=android/build/config.gradle
          echo "--- trước khi sửa"; grep -nE "compileSdk|targetSdk|minSdk|buildTools" $CFG || true
          sed -i -E "s/(compileSdk\s*:\s*)[0-9]+/\136/; s/(targetSdk\s*:\s*)[0-9]+/\136/" $CFG
          echo "--- sau khi sửa"; grep -nE "compileSdk|targetSdk|minSdk|buildTools" $CFG || true
          echo "android.suppressUnsupportedCompileSdk=36" >> android/build/gradle.properties
          chmod +x android/build/gradlew || true

      - name: Export AAB
        if: github.event_name == 'workflow_dispatch' && inputs.aab
        run: |
          mkdir -p build
          ~/godot/godot --headless --path . --export-release "Android AAB" build/laixe3d.aab
          ls -la build

      - name: Export APK
        run: |
          mkdir -p build
          ~/godot/godot --headless --path . --export-release "Android APK" build/laixe3d.apk
          ls -la build
          test -f build/laixe3d.apk

      - name: Check target SDK
        run: |
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          $BT/aapt2 dump badging build/laixe3d.apk | grep -E "package:|sdkVersion|targetSdkVersion" || true

      - uses: actions/upload-artifact@v4
        with:
          name: laixe3d-${{ github.run_number }}
          if-no-files-found: ignore
          path: |
            build/laixe3d.apk
            build/laixe3d.aab
